<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage au Sort - Noël 2026</title>
  <style>
    :root {
      --primary: #165b33;
      --accent: #bb2525;
      --bg: #0b3c1d;
      --card: #ffffff;
      --text: #2c3e50;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    h1 { color: var(--accent); text-align: center; margin-top: 0; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 12px; border: none; background: #eee;
      border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .tab-btn.active { background: var(--primary); color: white; }
    .section { display: none; }
    .section.active { display: block; }
    input, button, textarea {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px;
      border: 1px solid #ccc; box-sizing: border-box;
    }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    button.btn-danger { background: var(--accent); }
    .card { background: #f9f9f9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid var(--primary); }
    .member-item { display: flex; justify-content: space-between; align-items: center; background: #f1f1f1; padding: 10px; margin: 5px 0; border-radius: 6px; }
  </style>

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
  <h1>🎄 Noël 2026 🎅</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('user')">🎁 Mon Espace</button>
    <button class="tab-btn" onclick="switchTab('admin')">⚙️ Admin / Codes</button>
  </div>

  <!-- SECTION UTILISATEUR -->
  <div id="user-section" class="section active">
    <div id="login-box">
      <h3>Connexion</h3>
      <input type="number" id="pin-input" placeholder="Entre ton code PIN à 4 chiffres">
      <button onclick="loginUser()">Accéder à mon tirage</button>
    </div>

    <div id="user-dashboard" style="display:none;">
      <h2 id="welcome-msg"></h2>
      <div class="card">
        <h3>🎯 Tu dois offrir un cadeau à :</h3>
        <h2 id="target-name" style="color: var(--accent);">...</h2>
      </div>

      <div class="card">
        <h3>📝 Ma liste de souhaits</h3>
        <textarea id="my-wishlist" rows="3" placeholder="Écris tes idées cadeaux ici..."></textarea>
        <button onclick="saveWishlist()">Enregistrer ma liste</button>
      </div>

      <div class="card">
        <h3>💡 Liste de souhaits de ta cible</h3>
        <p id="target-wishlist">Aucune idée enregistrée pour l'instant.</p>
      </div>
      
      <button onclick="logout()" class="btn-danger" style="margin-top:15px;">Se déconnecter</button>
    </div>
  </div>

  <!-- SECTION ADMIN -->
  <div id="admin-section" class="section">
    <div id="admin-login">
      <h3>Accès Administrateur</h3>
      <input type="password" id="admin-pin" placeholder="Code PIN Admin (ex: 999)">
      <button onclick="loginAdmin()">Valider</button>
    </div>

    <div id="admin-dashboard" style="display:none;">
      <h3>👥 Membres de la famille</h3>
      <div style="display:flex; gap:10px;">
        <input type="text" id="new-member-name" placeholder="Prénom (ex: Papa, Maman)">
        <button onclick="addMember()" style="width: auto;">Ajouter</button>
      </div>

      <div id="members-list"></div>

      <hr style="margin: 20px 0;">
      <h3>🎲 Tirage au Sort</h3>
      <button onclick="generateDraw()" class="btn-danger">Lancer / Relancer le Tirage</button>
      
      <button onclick="logoutAdmin()" style="margin-top:20px; background:#666;">Fermer l'admin</button>
    </div>
  </div>
</div>

<script>
  // Configuration Firebase
  const firebaseConfig = {
    databaseURL: "https://noel-famille-86a66-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentUser = null;
  let allData = { members: {}, assignments: {} };

  // Écoute des données en temps réel sur Firebase
  db.ref().on('value', (snapshot) => {
    allData = snapshot.val() || { members: {}, assignments: {} };
    if (!allData.members) allData.members = {};
    if (!allData.assignments) allData.assignments = {};
    
    renderAdminMembers();
    if (currentUser) updateUserData();
  });

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    if (tab === 'user') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('user-section').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('admin-section').classList.add('active');
    }
  }

  // Auth User
  function loginUser() {
    const pin = document.getElementById('pin-input').value.trim();
    const memberKey = Object.keys(allData.members).find(k => allData.members[k].pin == pin);
    
    if (memberKey) {
      currentUser = { id: memberKey, ...allData.members[memberKey] };
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('user-dashboard').style.display = 'block';
      updateUserData();
    } else {
      alert("Code PIN invalide.");
    }
  }

  function updateUserData() {
    if (!currentUser) return;
    const freshData = allData.members[currentUser.id];
    document.getElementById('welcome-msg').innerText = `Bonjour ${freshData.name} !`;
    document.getElementById('my-wishlist').value = freshData.wishlist || '';

    const targetId = allData.assignments ? allData.assignments[currentUser.id] : null;
    if (targetId && allData.members[targetId]) {
      const target = allData.members[targetId];
      document.getElementById('target-name').innerText = target.name;
      document.getElementById('target-wishlist').innerText = target.wishlist || "N'a encore rien inscrit.";
    } else {
      document.getElementById('target-name').innerText = "Le tirage n'a pas encore eu lieu.";
      document.getElementById('target-wishlist').innerText = "-";
    }
  }

  function saveWishlist() {
    if (!currentUser) return;
    const text = document.getElementById('my-wishlist').value;
    db.ref('members/' + currentUser.id + '/wishlist').set(text);
    alert("Liste mise à jour !");
  }

  function logout() {
    currentUser = null;
    document.getElementById('login-box').style.display = 'block';
    document.getElementById('user-dashboard').style.display = 'none';
    document.getElementById('pin-input').value = '';
  }

  // Admin Functions
  function loginAdmin() {
    const pin = document.getElementById('admin-pin').value.trim();
    if (pin === '999' || pin === '9999') {
      document.getElementById('admin-login').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'block';
      renderAdminMembers();
    } else {
      alert("Code admin incorrect.");
    }
  }

  function logoutAdmin() {
    document.getElementById('admin-login').style.display = 'block';
    document.getElementById('admin-dashboard').style.display = 'none';
    document.getElementById('admin-pin').value = '';
  }

  function addMember() {
    const nameInput = document.getElementById('new-member-name');
    const name = nameInput.value.trim();
    if (!name) return;

    const pin = Math.floor(1000 + Math.random() * 9000);
    const newRef = db.ref('members').push();
    newRef.set({ name: name, pin: pin, wishlist: '' });
    nameInput.value = '';
  }

  function removeMember(id) {
    if (confirm("Supprimer ce membre ?")) {
      db.ref('members/' + id).remove();
    }
  }

  function renderAdminMembers() {
    const list = document.getElementById('members-list');
    list.innerHTML = '';
    Object.keys(allData.members).forEach(id => {
      const m = allData.members[id];
      list.innerHTML += `
        <div class="member-item">
          <span><strong>${m.name}</strong> (PIN: ${m.pin})</span>
          <button onclick="removeMember('${id}')" class="btn-danger" style="width:auto; padding: 6px 12px;">X</button>
        </div>
      `;
    });
  }

  function generateDraw() {
    const keys = Object.keys(allData.members);
    if (keys.length < 2) {
      alert("Il faut au moins 2 membres pour le tirage.");
      return;
    }

    let receivers = [...keys];
    let result = {};
    let valid = false;

    while (!valid) {
      receivers.sort(() => Math.random() - 0.5);
      valid = true;
      for (let i = 0; i < keys.length; i++) {
        if (keys[i] === receivers[i]) {
          valid = false;
          break;
        }
      }
    }

    for (let i = 0; i < keys.length; i++) {
      result[keys[i]] = receivers[i];
    }

    db.ref('assignments').set(result);
    alert("Tirage au sort effectué avec succès !");
  }
</script>

</body>
</html>
